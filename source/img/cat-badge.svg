  <circle cx="40.5" cy="34.5" r="2.9" fill="#3d2e24"/>
  <circle cx="22.6" cy="33.5" r="1" fill="#ffffff"/>
  <circle cx="39.6" cy="33.5" r="1" fill="#ffffff"/>

