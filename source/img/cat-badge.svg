  <path d="M27.8 41.2 C28.8 42.8 31.2 42.8 32 40.4 C32.8 42.8 35.2 42.8 36.2 41.2" fill="none" stroke="#3d2e24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

