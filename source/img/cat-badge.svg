      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#fde5cf"/>
    </linearGradient>
    <linearGradient id="catFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e68"/>
